kind = "web"
previewPath = "/"
title = "Blob Character"
version = "1.0.0"
id = "artifacts/blob-character"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20643

[services.development]
run = "pnpm --filter @workspace/blob-character run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blob-character", "run", "build" ]
publicDir = "artifacts/blob-character/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20643"
BASE_PATH = "/"
